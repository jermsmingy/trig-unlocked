name: Assemble lesson from parts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: assemble-parts
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: asm
        name: Assemble file from parts (only when all parts are present and verified)
        run: |
          echo "assembled=false" >> "$GITHUB_OUTPUT"
          if [ ! -f parts/SHA256SUMS ] || [ ! -f parts/TARGET ]; then echo "Nothing to assemble."; exit 0; fi
          read -r target expected msg < parts/TARGET
          cd parts
          if ! sha256sum -c SHA256SUMS; then echo "Parts incomplete or mismatched; skipping."; exit 0; fi
          perl -pi -e 's/\@\@E:([a-z#0-9]+)\@\@/chr(38).$1.";"/ge' part*.txt
          cd ..
          mkdir -p "$(dirname "$target")"
          cat parts/part*.txt > "$target"
          echo "$expected  $target" | sha256sum -c -
          echo "a39976aebd19a94c8785d6d5d3c197e56a8bb8d6e0728779c2984c401549c3b8  index.html" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -r -q -f parts
          git add "$target"
          git commit -m "$msg"
          git push
          echo "assembled=true" >> "$GITHUB_OUTPUT"
      - name: Request a Pages rebuild
        if: steps.asm.outputs.assembled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
